name: Offline language MVP

on:
  push:
    branches: [mvp/auto-language]
    paths-ignore: ['docs/**', '*.md']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mvp-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: android-actions/setup-android@v4
      - name: Install SDK and validation dependency
        shell: pwsh
        run: |
          sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
          if ($LASTEXITCODE -ne 0) { throw 'SDK installation failed' }
          python -m pip install 'PyYAML==6.0.3'
      - name: Prepare pinned offline Wanxiang resources
        shell: pwsh
        run: |
          python scripts/download-wanxiang.py
          if ($LASTEXITCODE -ne 0) { throw 'Resource download failed' }
          python scripts/import-wanxiang.py
          if ($LASTEXITCODE -ne 0) { throw 'Resource import failed' }
          python scripts/verify-wanxiang.py
          if ($LASTEXITCODE -ne 0) { throw 'Resource validation failed' }
      - name: Build, unit test and verify signed APKs
        shell: pwsh
        run: ./scripts/build-mvp.ps1 -JavaHome $env:JAVA_HOME -AndroidSdk $env:ANDROID_HOME -OutputDir outputs -RunTests
      - name: Upload APKs and validation evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: trime-offline-language-mvp
          path: |
            outputs/
            docs/wanxiang-validation.json
            docs/wanxiang-assets.manifest.json
            app/build/reports/tests/testDebugUnitTest/
          if-no-files-found: warn
          retention-days: 14

  smoke:
    needs: apk
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: android-actions/setup-android@v4
      - uses: actions/download-artifact@v8
        with:
          name: trime-offline-language-mvp
          path: downloaded-apk
      - name: Build independent QA editor
        run: |
          sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
          python scripts/qa/build-editor.py --output outputs/qa-editor
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          test -r /dev/kvm && test -w /dev/kvm
      - name: Fresh API 35 x86_64 emulator smoke
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: default
          arch: x86_64
          profile: pixel_2
          ram-size: 4096M
          heap-size: 512M
          disk-size: 8192M
          disable-animations: true
          disable-spellchecker: true
          disable-linux-hw-accel: false
          emulator-boot-timeout: 600
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot -camera-back none
          script: python scripts/qa/emulator-smoke.py --apk downloaded-apk --editor outputs/qa-editor/trime-qa-editor.apk --deploy-timeout 600 --output outputs/emulator-smoke
      - name: Upload smoke evidence even on failure
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: trime-emulator-smoke-${{ github.run_attempt }}
          path: |
            outputs/emulator-smoke/
            outputs/qa-editor/trime-qa-editor.apk
            outputs/qa-editor/sha256.txt
          if-no-files-found: warn
          retention-days: 14
